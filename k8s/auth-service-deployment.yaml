apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hectron
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: gcr.io/abadalabs-hectron-prod/hectron-auth-service:latest
        ports:
        - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: hectron
spec:
  selector:
    app: auth-service
  ports:
  - port: 3003
    targetPort: 3003
  type: ClusterIP