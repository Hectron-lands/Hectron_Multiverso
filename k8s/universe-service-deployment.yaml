apiVersion: apps/v1
kind: Deployment
metadata:
  name: universe-service
  namespace: hectron
spec:
  replicas: 3
  selector:
    matchLabels:
      app: universe-service
  template:
    metadata:
      labels:
        app: universe-service
    spec:
      containers:
      - name: universe-service
        image: gcr.io/abadalabs-hectron-prod/hectron-universe-service:latest
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: universe-service
  namespace: hectron
spec:
  selector:
    app: universe-service
  ports:
  - port: 3002
    targetPort: 3002
  type: ClusterIP