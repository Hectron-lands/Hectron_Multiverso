apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: hectron
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-service
  template:
    metadata:
      labels:
        app: metrics-service
    spec:
      containers:
      - name: metrics-service
        image: gcr.io/abadalabs-hectron-prod/hectron-metrics-service:latest
        ports:
        - containerPort: 3004
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  namespace: hectron
spec:
  selector:
    app: metrics-service
  ports:
  - port: 3004
    targetPort: 3004
  type: ClusterIP