apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification-service
  namespace: hectron
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gamification-service
  template:
    metadata:
      labels:
        app: gamification-service
    spec:
      containers:
      - name: gamification-service
        image: gcr.io/abadalabs-hectron-prod/hectron-gamification-service:latest
        ports:
        - containerPort: 3006
---
apiVersion: v1
kind: Service
metadata:
  name: gamification-service
  namespace: hectron
spec:
  selector:
    app: gamification-service
  ports:
  - port: 3006
    targetPort: 3006
  type: ClusterIP